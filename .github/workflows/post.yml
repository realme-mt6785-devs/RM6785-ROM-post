name: Post to channel

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: write

# Never cancelled: a run that has already sent the post must be allowed to finish
# labelling and recording it.
concurrency:
  group: publish-${{ github.event.issue.number }}

jobs:
  publish:
    if: github.event.label.name == 'approved' || startsWith(github.event.label.name, 'approved:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          ref: tooling
          path: .tooling

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: .tooling

      - id: publish
        working-directory: .tooling
        run: bun run src/cli/publish.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          APPROVAL_LABEL: ${{ github.event.label.name }}
          GITHUB_ACTOR: ${{ github.actor }}
          POST_STYLE: ${{ vars.POST_STYLE }}
          TELEGRAM_RM6785_CHANNEL: ${{ vars.TELEGRAM_RM6785_CHANNEL }}
          TELEGRAM_DEV_GROUP: ${{ vars.TELEGRAM_DEV_GROUP }}
          TELEGRAM_STICKER_FILE_ID: ${{ vars.TELEGRAM_STICKER_FILE_ID }}
          RECORD_ROOT: ${{ github.workspace }}

      # The post is already in the channel by now. If this step fails the record is
      # missing but nothing double-posts, because the issue is labelled `posted`.
      - if: steps.publish.outputs.record != ''
        env:
          RECORD: ${{ steps.publish.outputs.record }}
          SUBJECT: ${{ steps.publish.outputs.commit-subject }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$RECORD"
          git commit --message "$SUBJECT"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash
          done
          exit 1

      # Nudges the docs site to rebuild so the build shows up there straight
      # away. Deliberately best-effort: the post is in the channel and the record
      # is pushed by now, and RM6785-docs rebuilds nightly regardless, so a
      # missing or expired token must not fail a run that already published.
      - if: steps.publish.outputs.record != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo 'DOCS_DISPATCH_TOKEN is not set; the site will pick this up on its next scheduled build'
            exit 0
          fi
          gh api --method POST \
            repos/${{ github.repository_owner }}/RM6785-docs/dispatches \
            --field event_type=records-updated
